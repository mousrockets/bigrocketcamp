<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Big Rocket Camp</title>
    <meta name="description" content="Nos matchs Rocket League, nos classements 2v2 et nos défis sportifs." />
    <link rel="icon" href="/icons/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Set to the club's name once it is known (src/web/app.tsx). -->
    <meta name="apple-mobile-web-app-title" content="Big Rocket Camp" />
    <!-- The colour of the opening screen, before the style sheet arrives: no white flash in the installed app. -->
    <style>
      html { background: #000; }
    </style>
    <!-- The site is private: the manifest request must carry the session cookie. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <!-- Keeps the install prompt, which browsers fire before React starts. -->
    <script>
      addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        window.__rlInstall = event;
        dispatchEvent(new Event('rl-install-ready'));
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
